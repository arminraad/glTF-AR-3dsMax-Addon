name: Build MZP

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build MZP
        run: python tools/build_mzp.py

      - name: Upload MZP artifact
        uses: actions/upload-artifact@v4
        with:
          name: AR-glTF-Material-Forge-v1.3.1
          path: dist/AR_glTF_Material_Forge_1_3_1.mzp
          if-no-files-found: error

      - name: Commit built MZP to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/AR_glTF_Material_Forge_1_3_1.mzp
          if ! git diff --cached --quiet; then
            git commit -m "Build AR glTF Material Forge v1.3.1 [skip ci]"
            git push
          fi
